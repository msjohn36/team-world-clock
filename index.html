<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Team Time Zones</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      /* No widget background */
      background: transparent;

      color: #f1f1ef;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;

      overflow: hidden;
    }


    body {
      padding: 2px;
    }


    .clock-container {
      width: 100%;
      margin: 0;
      padding: 0;
      background: transparent;
    }


    /* ==========================
       CLOCK ROW
       ========================== */

    .clock-card {
      position: relative;

      display: flex;
      justify-content: space-between;
      align-items: center;

      width: 100%;
      height: 46px;

      margin: 0 0 3px 0;

      padding:
        5px
        12px
        5px
        15px;

      /* No card background */
      background: transparent;

      border: 1px solid #373737;
      border-radius: 7px;
    }


    .clock-card:last-child {
      margin-bottom: 0;
    }


    /* ==========================
       COLORED BAR
       ========================== */

    .clock-card::before {
      content: "";

      position: absolute;

      left: 0;
      top: 4px;
      bottom: 4px;

      width: 4px;

      border-radius:
        0
        3px
        3px
        0;

      background: var(--accent);
    }


    /* ==========================
       LEFT SIDE
       ========================== */

    .clock-info {
      flex: 1;
      min-width: 0;
      padding-right: 8px;
    }


    .zone-name {
      margin: 0 0 2px 0;

      color: #f1f1ef;

      font-size: 13px;
      font-weight: 650;

      line-height: 1.05;

      white-space: nowrap;
    }


    .members {
      color: #a9a9a6;

      font-size: 9px;

      line-height: 1;

      white-space: nowrap;

      overflow: hidden;
      text-overflow: ellipsis;
    }


    /* ==========================
       RIGHT SIDE
       ========================== */

    .clock-time {
      flex-shrink: 0;
      text-align: right;
    }


    .time {
      color: #ffffff;

      font-size: 18px;
      font-weight: 700;

      line-height: 1;

      white-space: nowrap;
    }


    .date {
      margin-top: 3px;

      color: #a9a9a6;

      font-size: 8px;

      line-height: 1;

      white-space: nowrap;
    }


    /* ==========================
       COLORS
       ========================== */

    /* ASU Maroon */
    .arizona {
      --accent: #8C1D40;
    }

    .pacific {
      --accent: #ff646e;
    }

    .mountain {
      --accent: #75d35b;
    }

    .central {
      --accent: #4aa8f5;
    }

    .eastern {
      --accent: #9a6df0;
    }

    .egypt {
      --accent: #42c9c9;
    }

    .arabia {
      --accent: #f44f83;
    }


    /* ==========================
       EXTRA-NARROW NOTION COLUMN
       ========================== */

    @media (max-width: 450px) {

      .clock-card {
        height: 44px;

        padding:
          4px
          8px
          4px
          13px;
      }


      .zone-name {
        font-size: 12px;
      }


      .members {
        font-size: 8px;
      }


      .time {
        font-size: 16px;
      }


      .date {
        font-size: 7px;
      }

    }

  </style>

</head>


<body>

  <div
    class="clock-container"
    id="clocks">
  </div>


  <script>

    const locations = [

      {
        name: "Arizona Time (MST)",
        zone: "America/Phoenix",
        members: "ASU Time",
        className: "arizona"
      },

      {
        name: "Pacific Time (PT)",
        zone: "America/Los_Angeles",
        members: "Mariella Ballard • Kevin Brindle",
        className: "pacific"
      },

      {
        name: "Mountain Time (MT)",
        zone: "America/Denver",
        members: "Mindy Johnston",
        className: "mountain"
      },

      {
        name: "Central Time (CT)",
        zone: "America/Chicago",
        members: "Nicholas Vansandt • Brianna Beasley",
        className: "central"
      },

      {
        name: "Eastern Time (ET)",
        zone: "America/New_York",
        members: "Alo Cazares Rojas • Jacob Chelsey • Kyle Kostner • Rebecca Ng",
        className: "eastern"
      },

      {
        name: "Egypt Time",
        zone: "Africa/Cairo",
        members: "Mahmoud Mostafa",
        className: "egypt"
      },

      {
        name: "Arabia Time (AST)",
        zone: "Asia/Riyadh",
        members: "Shahd Diab",
        className: "arabia"
      }

    ];


    function createClocks() {

      const container =
        document.getElementById("clocks");


      container.innerHTML =
        locations.map((location, index) => `

          <div class="clock-card ${location.className}">

            <div class="clock-info">

              <div class="zone-name">
                ${location.name}
              </div>

              <div class="members">
                ${location.members}
              </div>

            </div>


            <div class="clock-time">

              <div
                class="time"
                id="time-${index}">
              </div>

              <div
                class="date"
                id="date-${index}">
              </div>

            </div>

          </div>

        `).join("");

    }


    function updateClocks() {

      const now = new Date();


      locations.forEach((location, index) => {


        /* TIME */

        const time =
          new Intl.DateTimeFormat(
            "en-US",
            {
              timeZone: location.zone,

              hour: "numeric",
              minute: "2-digit",

              hour12: true
            }
          ).format(now);


        /* SHORT DATE */

        const date =
          new Intl.DateTimeFormat(
            "en-US",
            {
              timeZone: location.zone,

              weekday: "short",
              month: "short",
              day: "numeric"
            }
          ).format(now);


        document
          .getElementById(`time-${index}`)
          .textContent = time;


        document
          .getElementById(`date-${index}`)
          .textContent = date;

      });

    }


    createClocks();

    updateClocks();


    /* Update every minute */

    setInterval(
      updateClocks,
      60000
    );

  </script>

</body>

</html>
