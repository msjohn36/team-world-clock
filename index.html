<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Team Time Zones</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      background: #ffffff;

      color: #37352f;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;

      overflow: hidden;
    }

    body {
      padding: 2px;
    }

    .clock-container {
      width: 100%;
      margin: 0;
      padding: 0;
    }


    /* =========================
       CLOCK ROW
       ========================= */

    .clock-card {
      --accent: #888888;

      position: relative;

      display: flex;
      align-items: center;
      justify-content: space-between;

      width: 100%;
      height: 42px;

      margin: 0 0 3px 0;

      padding:
        5px
        10px
        5px
        15px;

      /* Notion light-mode style */
      background: #fbfbfa;

      border: 1px solid #e3e2e0;

      border-radius: 6px;
    }

    .clock-card:last-child {
      margin-bottom: 0;
    }


    /* =========================
       COLORED BAR
       ========================= */

    .clock-card::before {
      content: "";

      position: absolute;

      left: 0;
      top: 4px;
      bottom: 4px;

      width: 4px;

      background: var(--accent);

      border-radius:
        0
        3px
        3px
        0;
    }


    /* =========================
       LEFT SIDE
       ========================= */

    .clock-info {
      flex: 1;

      min-width: 0;

      padding-right: 8px;
    }

    .zone-name {
      margin: 0 0 3px 0;

      /* Notion main text */
      color: #37352f;

      font-size: 12px;
      font-weight: 600;

      line-height: 1;

      white-space: nowrap;
    }

    .members {
      /* Notion secondary text */
      color: #787774;

      font-size: 8px;
      font-weight: 400;

      line-height: 1;

      white-space: nowrap;

      overflow: hidden;
      text-overflow: ellipsis;
    }


    /* =========================
       RIGHT SIDE
       ========================= */

    .clock-time {
      flex-shrink: 0;

      text-align: right;
    }

    .time {
      color: #37352f;

      font-size: 16px;
      font-weight: 650;

      line-height: 1;

      white-space: nowrap;
    }

    .date {
      margin-top: 3px;

      color: #787774;

      font-size: 7px;
      font-weight: 400;

      line-height: 1;

      white-space: nowrap;
    }


    /* =========================
       TIME ZONE COLORS
       ========================= */

    /* ASU Maroon */
    .arizona {
      --accent: #8C1D40;
    }

    .pacific {
      --accent: #e2555f;
    }

    .mountain {
      --accent: #5f9f48;
    }

    .central {
      --accent: #4285b9;
    }

    .eastern {
      --accent: #8665ba;
    }

    .egypt {
      --accent: #3c9997;
    }

    .arabia {
      --accent: #c84e73;
    }

  </style>

</head>


<body>

  <div
    class="clock-container"
    id="clocks">
  </div>


  <script>

    const locations = [

      {
        name: "Arizona Time (MST)",
        zone: "America/Phoenix",
        members: "ASU Time",
        className: "arizona"
      },

      {
        name: "Pacific Time (PT)",
        zone: "America/Los_Angeles",
        members: "Mariella Ballard • Kevin Brindle",
        className: "pacific"
      },

      {
        name: "Mountain Time (MT)",
        zone: "America/Denver",
        members: "Mindy Johnston",
        className: "mountain"
      },

      {
        name: "Central Time (CT)",
        zone: "America/Chicago",
        members: "Nicholas Vansandt • Brianna Beasley",
        className: "central"
      },

      {
        name: "Eastern Time (ET)",
        zone: "America/New_York",
        members:
          "Alo Cazares Rojas • Jacob Chelsey • Kyle Kostner • Rebecca Ng",
        className: "eastern"
      },

      {
        name: "Egypt Time",
        zone: "Africa/Cairo",
        members: "Mahmoud Mostafa",
        className: "egypt"
      },

      {
        name: "Arabia Time (AST)",
        zone: "Asia/Riyadh",
        members: "Shahd Diab",
        className: "arabia"
      }

    ];


    function createClocks() {

      const container =
        document.getElementById("clocks");

      container.innerHTML =
        locations.map((location, index) => `

          <div class="clock-card ${location.className}">

            <div class="clock-info">

              <div class="zone-name">
                ${location.name}
              </div>

              <div class="members">
                ${location.members}
              </div>

            </div>


            <div class="clock-time">

              <div
                class="time"
                id="time-${index}">
              </div>

              <div
                class="date"
                id="date-${index}">
              </div>

            </div>

          </div>

        `).join("");

    }


    function updateClocks() {

      const now = new Date();

      locations.forEach((location, index) => {

        const time =
          new Intl.DateTimeFormat(
            "en-US",
            {
              timeZone: location.zone,
              hour: "numeric",
              minute: "2-digit",
              hour12: true
            }
          ).format(now);


        const date =
          new Intl.DateTimeFormat(
            "en-US",
            {
              timeZone: location.zone,
              weekday: "short",
              month: "short",
              day: "numeric"
            }
          ).format(now);


        document
          .getElementById(`time-${index}`)
          .textContent = time;


        document
          .getElementById(`date-${index}`)
          .textContent = date;

      });

    }


    createClocks();

    updateClocks();

    setInterval(updateClocks, 60000);

  </script>

</body>

</html>
