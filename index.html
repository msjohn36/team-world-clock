<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Team Time Zones</title>

  <style>

    /* ==============================
       BASIC SETUP
       ============================== */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      /*
        Matches Notion dark mode closely.
      */
      background: #191919;

      color: #f1f1ef;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;
    }


    body {
      padding: 4px;
    }


    /* ==============================
       CLOCK CONTAINER
       ============================== */

    .clock-container {
      width: 100%;
      max-width: 700px;

      margin: 0 auto;

      background: transparent;
    }


    /* ==============================
       CLOCK CARDS
       ============================== */

    .clock-card {

      position: relative;

      display: flex;

      justify-content: space-between;
      align-items: center;

      gap: 12px;

      /*
        Smaller height so all seven
        clocks fit better in Notion.
      */

      min-height: 68px;

      margin-bottom: 5px;

      padding:
        9px
        14px
        9px
        19px;


      /*
        Slightly lighter than Notion's
        page background.
      */

      background: #202020;

      border:
        1px solid
        #373737;

      border-radius: 9px;
    }


    /*
      Remove margin after final card.
    */

    .clock-card:last-child {
      margin-bottom: 0;
    }


    /* ==============================
       COLORED LEFT BAR
       ============================== */

    .clock-card::before {

      content: "";

      position: absolute;

      left: 0;

      top: 6px;
      bottom: 6px;

      width: 5px;

      border-radius:
        0
        4px
        4px
        0;

      background:
        var(--accent);
    }


    /* ==============================
       LEFT SIDE
       ============================== */

    .clock-info {

      flex: 1;

      min-width: 0;

    }


    .zone-name {

      margin-bottom: 4px;

      color: #f1f1ef;

      font-size: 16px;

      font-weight: 700;

      line-height: 1.15;

    }


    .members {

      color: #a9a9a6;

      font-size: 11px;

      line-height: 1.3;

    }


    /* ==============================
       RIGHT SIDE
       ============================== */

    .clock-time {

      flex-shrink: 0;

      text-align: right;

    }


    .time {

      color: #ffffff;

      font-size: 23px;

      font-weight: 700;

      line-height: 1;

      white-space: nowrap;

    }


    .date {

      margin-top: 5px;

      color: #a9a9a6;

      font-size: 10px;

      white-space: nowrap;

    }


    /* ==============================
       TIME ZONE COLORS
       ============================== */


    /*
      Arizona / ASU
      Official-style ASU maroon
    */

    .arizona {
      --accent: #8C1D40;
    }


    /*
      Pacific
    */

    .pacific {
      --accent: #ff646e;
    }


    /*
      Mountain
    */

    .mountain {
      --accent: #75d35b;
    }


    /*
      Central
    */

    .central {
      --accent: #4aa8f5;
    }


    /*
      Eastern
    */

    .eastern {
      --accent: #9a6df0;
    }


    /*
      Egypt
    */

    .egypt {
      --accent: #42c9c9;
    }


    /*
      Arabia
    */

    .arabia {
      --accent: #f44f83;
    }


    /* ==============================
       SMALL NOTION COLUMN
       ============================== */

    @media (max-width: 450px) {

      body {
        padding: 2px;
      }


      .clock-card {

        min-height: 62px;

        margin-bottom: 4px;

        padding:
          8px
          9px
          8px
          16px;

        gap: 6px;

      }


      .clock-card::before {

        width: 4px;

        top: 5px;
        bottom: 5px;

      }


      .zone-name {

        font-size: 13px;

        margin-bottom: 3px;

      }


      .members {

        font-size: 9px;

      }


      .time {

        font-size: 19px;

      }


      .date {

        font-size: 8px;

        margin-top: 4px;

      }

    }

  </style>

</head>


<body>


  <div
    class="clock-container"
    id="clocks">
  </div>


  <script>

    /*
      =================================
      TEAM TIME ZONES
      =================================
    */

    const locations = [


      /*
        Arizona / ASU
      */

      {
        name: "Arizona Time (MST)",

        zone:
          "America/Phoenix",

        members:
          "ASU Time",

        className:
          "arizona"
      },


      /*
        Pacific
      */

      {
        name:
          "Pacific Time (PT)",

        zone:
          "America/Los_Angeles",

        members:
          "Mariella Ballard • Kevin Brindle",

        className:
          "pacific"
      },


      /*
        Mountain
      */

      {
        name:
          "Mountain Time (MT)",

        zone:
          "America/Denver",

        members:
          "Mindy Johnston",

        className:
          "mountain"
      },


      /*
        Central
      */

      {
        name:
          "Central Time (CT)",

        zone:
          "America/Chicago",

        members:
          "Nicholas Vansandt • Brianna Beasley",

        className:
          "central"
      },


      /*
        Eastern
      */

      {
        name:
          "Eastern Time (ET)",

        zone:
          "America/New_York",

        members:
          "Alo Cazares Rojas • Jacob Chelsey • Kyle Kostner • Rebecca Ng",

        className:
          "eastern"
      },


      /*
        Egypt
      */

      {
        name:
          "Egypt Time",

        zone:
          "Africa/Cairo",

        members:
          "Mahmoud Mostafa",

        className:
          "egypt"
      },


      /*
        Arabia
      */

      {
        name:
          "Arabia Time (AST)",

        zone:
          "Asia/Riyadh",

        members:
          "Shahd Diab",

        className:
          "arabia"
      }

    ];



    /*
      =================================
      CREATE CLOCK CARDS
      =================================
    */

    function createClocks() {


      const container =
        document.getElementById(
          "clocks"
        );


      container.innerHTML =
        locations
          .map(
            (location, index) => `


              <div
                class="
                  clock-card
                  ${location.className}
                ">


                <div
                  class="clock-info">


                  <div
                    class="zone-name">

                    ${location.name}

                  </div>


                  <div
                    class="members">

                    ${location.members}

                  </div>


                </div>



                <div
                  class="clock-time">


                  <div
                    class="time"
                    id="time-${index}">
                  </div>


                  <div
                    class="date"
                    id="date-${index}">
                  </div>


                </div>


              </div>


            `
          )
          .join("");

    }



    /*
      =================================
      UPDATE TIMES
      =================================
    */

    function updateClocks() {


      const now =
        new Date();



      locations.forEach(

        (location, index) => {


          /*
            TIME
          */

          const time =

            new Intl.DateTimeFormat(

              "en-US",

              {

                timeZone:
                  location.zone,

                hour:
                  "numeric",

                minute:
                  "2-digit",

                hour12:
                  true

              }

            ).format(now);



          /*
            DATE
          */

          const date =

            new Intl.DateTimeFormat(

              "en-US",

              {

                timeZone:
                  location.zone,

                weekday:
                  "short",

                month:
                  "short",

                day:
                  "numeric",

                year:
                  "numeric"

              }

            ).format(now);



          /*
            PUT TIME ON PAGE
          */

          document
            .getElementById(
              `time-${index}`
            )
            .textContent =
              time;



          /*
            PUT DATE ON PAGE
          */

          document
            .getElementById(
              `date-${index}`
            )
            .textContent =
              date;


        }

      );

    }



    /*
      =================================
      START CLOCK
      =================================
    */

    createClocks();

    updateClocks();



    /*
      No seconds are displayed,
      so update once per minute.
    */

    setInterval(

      updateClocks,

      60000

    );


  </script>


</body>

</html>
