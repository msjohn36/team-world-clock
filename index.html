<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Team Time Zones</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #101214;
      color: #f1f1ef;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;
    }

    body {
      padding: 8px;
    }

    .clock-container {
      width: 100%;
      max-width: 650px;
      margin: 0 auto;
    }

    .clock-card {
      position: relative;

      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 16px;

      min-height: 82px;

      margin-bottom: 8px;
      padding: 13px 16px 13px 22px;

      background: #191b1d;

      border: 1px solid #34373a;
      border-radius: 11px;
    }

    /* LEFT COLORED BAR */

    .clock-card::before {
      content: "";

      position: absolute;

      left: 0;
      top: 7px;
      bottom: 7px;

      width: 6px;

      border-radius: 0 5px 5px 0;

      background: var(--accent);
    }

    /* LEFT SIDE */

    .clock-info {
      flex: 1;
      min-width: 0;
    }

    .zone-name {
      margin-bottom: 6px;

      color: #f5f5f5;

      font-size: 17px;
      font-weight: 700;

      line-height: 1.15;
    }

    .members {
      color: #a9aaad;

      font-size: 12px;
      font-weight: 400;

      line-height: 1.35;
    }

    /* RIGHT SIDE */

    .clock-time {
      flex-shrink: 0;

      text-align: right;
    }

    .time {
      color: #ffffff;

      font-size: 26px;
      font-weight: 700;

      line-height: 1;

      white-space: nowrap;
    }

    .date {
      margin-top: 7px;

      color: #a9aaad;

      font-size: 11px;

      white-space: nowrap;
    }

    /* -----------------------------
       TIME ZONE ACCENT COLORS
       ----------------------------- */

    /* ASU MAROON */
    .arizona {
      --accent: #8C1D40;
    }

    .pacific {
      --accent: #ff646e;
    }

    .mountain {
      --accent: #75d35b;
    }

    .central {
      --accent: #4aa8f5;
    }

    .eastern {
      --accent: #9a6df0;
    }

    .egypt {
      --accent: #42c9c9;
    }

    .arabia {
      --accent: #f44f83;
    }

    /* -----------------------------
       SMALL NOTION COLUMN
       ----------------------------- */

    @media (max-width: 450px) {

      body {
        padding: 5px;
      }

      .clock-card {
        min-height: 70px;

        padding:
          10px
          11px
          10px
          18px;

        gap: 8px;

        margin-bottom: 6px;
      }

      .zone-name {
        font-size: 14px;
        margin-bottom: 4px;
      }

      .members {
        font-size: 10px;
      }

      .time {
        font-size: 20px;
      }

      .date {
        font-size: 9px;
        margin-top: 5px;
      }

      .clock-card::before {
        width: 5px;
      }

    }
  </style>
</head>


<body>

  <div
    class="clock-container"
    id="clocks">
  </div>


  <script>

    const locations = [

      {
        name: "Arizona Time (MST)",
        zone: "America/Phoenix",
        members: "ASU Time",
        className: "arizona"
      },

      {
        name: "Pacific Time (PT)",
        zone: "America/Los_Angeles",
        members: "Mariella Ballard • Kevin Brindle",
        className: "pacific"
      },

      {
        name: "Mountain Time (MT)",
        zone: "America/Denver",
        members: "Mindy Johnston",
        className: "mountain"
      },

      {
        name: "Central Time (CT)",
        zone: "America/Chicago",
        members: "Nicholas Vansandt • Brianna Beasley",
        className: "central"
      },

      {
        name: "Eastern Time (ET)",
        zone: "America/New_York",
        members:
          "Alo Cazares Rojas • Jacob Chelsey • Kyle Kostner • Rebecca Ng",
        className: "eastern"
      },

      {
        name: "Egypt Time",
        zone: "Africa/Cairo",
        members: "Mahmoud Mostafa",
        className: "egypt"
      },

      {
        name: "Arabia Time (AST)",
        zone: "Asia/Riyadh",
        members: "Shahd Diab",
        className: "arabia"
      }

    ];


    function createClocks() {

      const container =
        document.getElementById("clocks");


      container.innerHTML =
        locations.map((location, index) => `

          <div
            class="clock-card ${location.className}">

            <div class="clock-info">

              <div class="zone-name">
                ${location.name}
              </div>

              <div class="members">
                ${location.members}
              </div>

            </div>


            <div class="clock-time">

              <div
                class="time"
                id="time-${index}">
              </div>

              <div
                class="date"
                id="date-${index}">
              </div>

            </div>

          </div>

        `).join("");

    }


    function updateClocks() {

      const now = new Date();


      locations.forEach(
        (location, index) => {

          const time =
            new Intl.DateTimeFormat(
              "en-US",
              {
                timeZone: location.zone,

                hour: "numeric",
                minute: "2-digit",

                hour12: true
              }
            ).format(now);


          const date =
            new Intl.DateTimeFormat(
              "en-US",
              {
                timeZone: location.zone,

                weekday: "short",
                month: "short",
                day: "numeric",
                year: "numeric"
              }
            ).format(now);


          document.getElementById(
            `time-${index}`
          ).textContent = time;


          document.getElementById(
            `date-${index}`
          ).textContent = date;

        }
      );

    }


    createClocks();

    updateClocks();


    /* Update once each minute */

    setInterval(
      updateClocks,
      60000
    );

  </script>

</body>
</html>
