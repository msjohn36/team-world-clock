<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Team Time Zones</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 8px;
      background: transparent;
      color: #37352f;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Helvetica, Arial, sans-serif;
    }

    .clock-container {
      width: 100%;
      max-width: 650px;
      margin: 0 auto;
    }

    .clock-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;

      min-height: 78px;
      margin-bottom: 7px;
      padding: 10px 14px;

      background: #ffffff;
      border: 1px solid #e4e4e4;
      border-radius: 10px;
    }

    .clock-info {
      min-width: 0;
      flex: 1;
    }

    .zone-name {
      font-size: 16px;
      font-weight: 650;
      line-height: 1.2;
      margin-bottom: 4px;
    }

    .members {
      color: #787774;
      font-size: 12px;
      line-height: 1.35;
    }

    .clock-time {
      text-align: right;
      flex-shrink: 0;
    }

    .time {
      font-size: 24px;
      font-weight: 650;
      line-height: 1.1;
      white-space: nowrap;
    }

    .date {
      color: #787774;
      font-size: 11px;
      margin-top: 5px;
      white-space: nowrap;
    }

    /* Arizona reference clock */
    .arizona {
      border-left: 4px solid #e9b44c;
    }

    /* Other time zones */
    .pacific {
      border-left: 4px solid #e57373;
    }

    .mountain {
      border-left: 4px solid #81c784;
    }

    .central {
      border-left: 4px solid #64b5f6;
    }

    .eastern {
      border-left: 4px solid #9575cd;
    }

    .egypt {
      border-left: 4px solid #4db6ac;
    }

    .arabia {
      border-left: 4px solid #f06292;
    }

    @media (prefers-color-scheme: dark) {
      body {
        color: #f1f1ef;
      }

      .clock-card {
        background: #191919;
        border-color: #373737;
      }

      .members,
      .date {
        color: #b4b4b0;
      }
    }

    @media (max-width: 420px) {
      .clock-card {
        padding: 9px 10px;
      }

      .zone-name {
        font-size: 14px;
      }

      .members {
        font-size: 10px;
      }

      .time {
        font-size: 20px;
      }

      .date {
        font-size: 10px;
      }
    }
  </style>
</head>

<body>

  <div class="clock-container" id="clocks"></div>

  <script>

    const locations = [

      {
        name: "Arizona Time (MST)",
        zone: "America/Phoenix",
        members: "ASU Time",
        className: "arizona"
      },

      {
        name: "Pacific Time (PT)",
        zone: "America/Los_Angeles",
        members: "Mariella Ballard • Kevin Brindle",
        className: "pacific"
      },

      {
        name: "Mountain Time (MT)",
        zone: "America/Denver",
        members: "Mindy Johnston",
        className: "mountain"
      },

      {
        name: "Central Time (CT)",
        zone: "America/Chicago",
        members: "Nicholas Vansandt • Brianna Beasley",
        className: "central"
      },

      {
        name: "Eastern Time (ET)",
        zone: "America/New_York",
        members: "Alo Cazares Rojas • Jacob Chelsey • Kyle Kostner • Rebecca Ng",
        className: "eastern"
      },

      {
        name: "Egypt Time",
        zone: "Africa/Cairo",
        members: "Mahmoud Mostafa",
        className: "egypt"
      },

      {
        name: "Arabia Time (AST)",
        zone: "Asia/Riyadh",
        members: "Shahd Diab",
        className: "arabia"
      }

    ];


    function createClocks() {

      const container = document.getElementById("clocks");

      container.innerHTML = locations.map((location, index) => `

        <div class="clock-card ${location.className}">

          <div class="clock-info">

            <div class="zone-name">
              ${location.name}
            </div>

            <div class="members">
              ${location.members}
            </div>

          </div>

          <div class="clock-time">

            <div
              class="time"
              id="time-${index}">
            </div>

            <div
              class="date"
              id="date-${index}">
            </div>

          </div>

        </div>

      `).join("");

    }


    function updateClocks() {

      const now = new Date();

      locations.forEach((location, index) => {

        const time = new Intl.DateTimeFormat(
          "en-US",
          {
            timeZone: location.zone,
            hour: "numeric",
            minute: "2-digit",
            hour12: true
          }
        ).format(now);


        const date = new Intl.DateTimeFormat(
          "en-US",
          {
            timeZone: location.zone,
            weekday: "short",
            month: "short",
            day: "numeric",
            year: "numeric"
          }
        ).format(now);


        document.getElementById(
          `time-${index}`
        ).textContent = time;


        document.getElementById(
          `date-${index}`
        ).textContent = date;

      });

    }


    createClocks();
    updateClocks();

    /* Seconds aren't displayed, so updating once per minute is enough */
    setInterval(updateClocks, 60000);

  </script>

</body>
</html>
